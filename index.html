<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clinical Dashboard v2</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            display: flex;
        }

        /* SIDEBAR */
        #sidebar {
            width: 28%;
            background: #1f2937;
            color: white;
            height: 100vh;
            overflow-y: auto;
            padding: 15px;
        }

        .patient {
            background: #374151;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        .patient:hover {
            background: #4b5563;
        }

        /* MAIN */
        #main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .row {
            margin: 5px 0;
        }

        /* BADGES */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 5px;
        }

        .active { background: #dcfce7; color: #166534; }
        .inactive { background: #fee2e2; color: #991b1b; }
        .unknown { background: #e5e7eb; color: #374151; }

        /* LIST ITEMS */
        .item {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        pre {
            background: #0f172a;
            color: #22c55e;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar">
    <h3>Patients</h3>
    <div id="patientList">Loading...</div>
</div>

<!-- MAIN -->
<div id="main">

    <div class="card">
        <div class="title">Patient Summary</div>
        <div id="patientDetails">Select a patient</div>
    </div>

    <div class="card">
        <div class="title">Conditions</div>
        <div id="conditions">---</div>
    </div>

    <div class="card">
        <div class="title">Medications</div>
        <div id="medications">---</div>
    </div>

<div class="card">
    <div class="title">Lab Results</div>
    <div id="observations">---</div>
</div>

<div class="card">
    <div class="title">Allergies</div>
    <div id="allergies">---</div>
</div>

<div class="card">
    <div class="title">Encounters</div>
    <div id="encounters">---</div>
</div>

<div class="card">
    <div class="title">Immunizations</div>
    <div id="immunizations">---</div>
</div>

<div class="card">
    <div class="title">Procedures</div>
    <div id="procedures">---</div>
</div>

<div class="card">
    <div class="title">Care Plans</div>
    <div id="careplans">---</div>
</div>

<div class="card">
    <div class="title">Diagnostic Reports</div>
    <div id="reports">---</div>
</div>

</div>

<script src="static/app.js"></script>

</body>
</html>
